# Large configuration for BDH model (for larger datasets)
model:
  vocab_size: 256
  n_neurons: 65536
  d_model: 512
  n_layers: 12

training:
  batch_size: 64
  learning_rate: 0.0005
  num_epochs: 50
  checkpoint_interval: 1000
  gradient_clip: 1.0
  weight_decay: 0.01

data:
  max_sequence_length: 1024
  train_split: 0.9
  val_split: 0.1

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  type: "cosine"
  warmup_steps: 1000
  t_total: 100000