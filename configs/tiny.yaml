# Tiny configuration for BDH model (for testing)
model:
  vocab_size: 256
  n_neurons: 1024
  d_model: 64
  n_layers: 2

# Distance-based neuron clustering (optional — remove to disable)
spatial_clustering:
  n_clusters: 16
  spatial_dim: 2
  sigma: 0.8
  decay_type: gaussian
  learnable_positions: true
  learnable_sigma: true
  min_decay: 0.05
  modulate_feedforward: true
  modulate_hebbian: true
  modulate_output: true

training:
  batch_size: 4
  learning_rate: 0.0001
  num_epochs: 100
  checkpoint_interval: 100

data:
  max_sequence_length: 64
