# Small configuration for BDH model
model:
  vocab_size: 256
  n_neurons: 8192
  d_model: 128
  n_layers: 4

# Distance-based neuron clustering (optional — remove to disable)
spatial_clustering:
  n_clusters: 64
  spatial_dim: 3
  sigma: 1.0
  decay_type: gaussian
  learnable_positions: true
  learnable_sigma: true
  min_decay: 0.01
  modulate_feedforward: true
  modulate_hebbian: true
  modulate_output: true

training:
  batch_size: 16
  learning_rate: 0.001
  num_epochs: 10
  checkpoint_interval: 500

data:
  max_sequence_length: 256
